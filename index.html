<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexo Credito — Iniciar sesión</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="/style/base.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
  .login-card { width: 100%; max-width: 340px; background: var(--surface); border-radius: var(--radius-lg); padding: 32px 28px; }
  .login-card .mark { width: 48px; height: 48px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 0 20px; }
  .login-card .mark i { color: var(--on-primary); font-size: 24px; }
  .login-card h1 { font-size: 18px; font-weight: 500; color: var(--ink); margin: 0 0 4px; }
  .login-card p.sub { font-size: 13px; color: var(--muted); margin: 0 0 24px; }
</style>
</head>
<body>

  <div class="login-card">
    <div class="mark"><i class="ti ti-cash"></i></div>
    <h1>NexoCredit</h1>
    <p class="sub">Ingresa a tu cuenta</p>

    <form id="login-form">
      <label class="field-label" for="usuario">Correo o usuario</label>
      <input class="field-input" style="margin-bottom:14px" type="text" id="usuario" placeholder="nombre@negocio.com" autocomplete="username">

      <label class="field-label" for="password">Contraseña</label>
      <input class="field-input" style="margin-bottom:8px" type="password" id="password" placeholder="••••••••" autocomplete="current-password">

      <p style="font-size:12px;color:var(--muted);text-align:right;margin:0 0 12px">¿Olvidaste tu contraseña?</p>

      <p class="form-error" id="login-error"></p>

      <button class="btn-primary" style="width:100%" type="submit" id="login-btn">Iniciar sesión</button>
    </form>

    <p style="font-size:11px;color:var(--muted);text-align:center;margin:16px 0 0">Demo: admin / admin123</p>
  </div>

<script src="/script/mock-data.js"></script>
<script src="/script/gm-api.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");

    errorEl.textContent = "";

    if (!usuario || !password) {
      errorEl.textContent = "Completa usuario y contraseña.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Ingresando…";

    try {
      const session = await pfApi.login(usuario, password);

      if (!session) {
        errorEl.textContent = "Usuario o contraseña incorrectos.";
        return;
      }

      window.location.href = "dashboard.html";
    } catch (err) {
      console.error("Error al iniciar sesión:", err);
      errorEl.textContent = "Ocurrió un error inesperado. Revisa la consola.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Iniciar sesión";
    }
  });

  // Si ya hay sesión activa, saltar directo al dashboard
  if (pfApi.getSession()) {
    window.location.href = "dashboard.html";
  }
</script>
</body>
</html>
